[tool.poetry]
name = "psqlgraph"
version = "3.1.0"
description = "Gen3 fork of NCI psqlgraph"
authors = ["CTDS UChicago <cdis@uchicago.edu>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/uc-cdis/psqlgraph"
packages = [
    { include = "./psqlgraph" }
]
[tool.poetry.dependencies]
python = "^3.6"
pytest = "*"
psycopg2 = "^2.8.2"
xlocal = "0.5"
requests = "2.22.0"
rstr = "2.2.6"
six = "1.12.0"
SQLAlchemy = "1.3.3"

[tool.poetry.dev-dependencies]
pytest = "4.5.0"
parameterized = "0.7.0"
pytest-cov = "2.7.1"
tox = "*"

[build-system]
requires = ["poetry>=1.0.9"]
build-backend = "poetry.masonry.api"
